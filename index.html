<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臨床藥學題庫隨機測驗系統</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning-bg: #fef2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    .container { max-width: 880px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 28px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); margin-bottom: 24px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #0f172a; text-align: center; }
    .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }
    .section-title { font-weight: 600; margin-bottom: 12px; font-size: 1.1rem; color: #334155; }
    .checkbox-group, .radio-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .option-label { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #f1f5f9; border-radius: 8px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
    .option-label:hover { background: #e2e8f0; }
    .option-label input:checked + span { font-weight: 600; color: var(--primary); }
    .btn { display: inline-block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; text-align: center; }
    .btn:hover { background: var(--primary-hover); }
    .question-card { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .question-header { font-weight: 600; margin-bottom: 12px; font-size: 1.05rem; }
    .chapter-tag { display: inline-block; padding: 2px 8px; background: #e0f2fe; color: #0369a1; border-radius: 4px; font-size: 0.8rem; margin-right: 8px; vertical-align: middle; }
    .choices-list { display: flex; flex-direction: column; gap: 8px; }
    .choice-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
    .choice-item:hover { background: #f8fafc; }
    .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .result-score { font-size: 2.5rem; font-weight: 700; text-align: center; color: var(--primary); margin: 16px 0; }
    .result-stat { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 1.1rem; }
    .review-item { padding: 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border); background: #fafafa; }
    .review-item.wrong { background: var(--warning-bg); border-color: #fca5a5; }
    .review-options { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; padding-left: 4px; }
    .review-opt { padding: 8px 12px; border-radius: 6px; font-size: 0.95rem; border: 1px solid var(--border); background: #ffffff; }
    .review-opt.is-correct { border-color: #86efac; background: #f0fdf4; color: #166534; font-weight: 600; }
    .review-opt.is-user-wrong { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
    .analysis { margin-top: 10px; padding: 10px; background: #ffffff; border-radius: 6px; font-size: 0.9rem; border-left: 3px solid var(--primary); }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 起始頁面 -->
  <div id="setup-view" class="card">
    <h1>臨床藥學題庫模擬測驗</h1>
    <div class="subtitle">共收錄 225 題完整題庫（已排除腎臟病題目）</div>

    <div class="section-title">步驟 1：選擇測驗章節（可複選）</div>
    <div class="checkbox-group">
      <label class="option-label"><input type="checkbox" name="chapter" value="asthma" checked> <span>氣喘 (54題)</span></label>
      <label class="option-label"><input type="checkbox" name="chapter" value="liver" checked> <span>肝臟疾病 (60題)</span></label>
      <label class="option-label"><input type="checkbox" name="chapter" value="pud" checked> <span>消化性潰瘍 (60題)</span></label>
      <label class="option-label"><input type="checkbox" name="chapter" value="copd" checked> <span>COPD (51題)</span></label>
    </div>

    <div class="section-title">步驟 2：選擇測驗題數</div>
    <div class="radio-group">
      <label class="option-label"><input type="radio" name="count" value="30" checked> <span>30 題</span></label>
      <label class="option-label"><input type="radio" name="count" value="50"> <span>50 題</span></label>
      <label class="option-label"><input type="radio" name="count" value="100"> <span>100 題</span></label>
      <label class="option-label"><input type="radio" name="count" value="all"> <span>所選章節全部題目</span></label>
    </div>

    <button class="btn" onclick="startQuiz()">開始隨機測驗</button>
  </div>

  <!-- 測驗進行頁面 -->
  <div id="quiz-view" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span id="quiz-progress-text" style="font-weight:600; color:var(--text-muted);">已作答：0 題</span>
      <span id="quiz-count-text" style="color:var(--text-muted); font-size:0.9rem;"></span>
    </div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    
    <div id="questions-container"></div>
    <button class="btn" onclick="submitQuiz()">交卷並查看成績</button>
  </div>

  <!-- 成果結算與解析頁面 -->
  <div id="result-view" class="card hidden">
    <h1>測驗結果</h1>
    <div class="result-score" id="score-display">0%</div>
    <div class="result-stat" id="stat-display">答對 0 題 / 總計 0 題</div>

    <div class="section-title">答題檢討與詳細解析</div>
    <div id="review-container"></div>

    <button class="btn" onclick="resetQuiz()">重新測驗</button>
  </div>
</div>

<script>
// 完整收錄 PDF 中四個非腎臟章節的所有題目、選項、原答案與解析[span_0](start_span)[span_0](end_span)[span_1](start_span)[span_1](end_span)[span_2](start_span)[span_2](end_span)
const QUESTION_BANK = {
  asthma: [
    { id:"A1", ch:"氣喘", q:"28歲女性反覆夜間喘鳴，平時無症狀時肺功能接近正常；症狀發作時，吸入 salbutamol 後 FEV1 由 2.00L 增至 2.36L。下列判讀最適當？", options:{A:"只要支氣管擴張後改善，即足以排除同時存在 COPD", B:"此結果支持可變性呼氣氣流受限，配合病史支持氣喘，但仍須完成整體診斷評估", C:"增加量未達500mL，不能支持氣喘", D:"單次肺功能曾正常即可排除氣喘"}, ans:"B", exp:"FEV1增加360mL、18%，達成人常用的≥12%且≥200mL支氣管擴張反應標準[span_3](start_span)[span_3](end_span)。氣喘仍須結合典型症狀及鑑別診斷；可逆性不是排除COPD共存的充分條件[span_4](start_span)[span_4](end_span)。" },
    { id:"A2", ch:"氣喘", q:"22 歲成人僅每月喘鳴2次，過去一年曾因急性惡化使用 prednisolone；目前只備有salbutamol。依 GINA 2026，最適當的處方檢視為何？", options:{A:"因症狀少於每週2次，維持 SABA 單用即可", B:"以 salmeterol 單用取代 salbutamol，可同時處理發炎", C:"只有FEV1 低於60%時才需要 ICS", D:"納入 ICS-containing 治療；可依適應條件採需要時低劑量 ICS-formoterol"}, ans:"D", exp:"症狀少不代表惡化風險低[span_5](start_span)[span_5](end_span)。成人與青少年不建議 SABA單用；既往嚴重惡化更強化 ICS-containing 治療的必要性[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span)。" },
    { id:"A3", ch:"氣喘", q:"使用低劑量 ICS-LABA 的成人ACT為16分。藥師發現病人每週漏用4天、pMDI操作時先噴藥再過數秒才吸氣。下一步最適當？", options:{A:"立即添加 omalizumab，表示ICS-LABA治療失敗", B:"停掉ICS，以規律 salbutamol 取代控制治療", C:"直接將ICS增加至最高劑量，避免延誤控制", D:"先矯正吸入技術與依從性，評估誘因及共病後再判斷是否升階"}, ans:"D", exp:"升階前應先檢查診斷、依從性、吸入技巧、暴露與共病，不能直接視為重度難治型氣喘[span_8](start_span)[span_8](end_span)。" },
    { id:"A4", ch:"氣喘", q:"病人使用 fluticasone-salmeterol 固定維持治療，詢問是否能把同一支當 MART 按需加吸。最適當的回應？", options:{A:"不能直接套用；MART須使用具相應證據及適用劑量的ICS-formoterol 組合", B:"只要同時含ICS 與任一LABA，都能直接作 MART", C:"若增加 fluticasone 含量，salmeterol 便會轉為快速起效", D:"salmeterol 較長效，因此比 formoterol 更適合即時緩解"}, ans:"A", exp:"ICS-LABA並非全部可互換作為緩解劑[span_9](start_span)[span_9](end_span)。MART主要建立於特定 ICS-formoterol 製劑；不能把維持用 fluticasone-salmeterol 直接改成按需急救[span_10](start_span)[span_10](end_span)。" },
    { id:"A5", ch:"氣喘", q:"成人以中劑量 ICS-formoterol 維持良好控制4個月，無近期感染或旅行計畫，也未懷孕。考慮降階時何者最適當？", options:{A:"先把ICS 改為LABA單方，再觀察2週", B:"先完全停用ICS，待症狀再出現時恢復", C:"記錄基準控制與肺功能、評估惡化風險後，降低維持ICS約25-50%，安排追蹤", D:"若ACT 正常，就可立即停掉所有藥物而不必追蹤"}, ans:"C", exp:"控制穩定2-3個月可考慮降階，但須評估風險、提供行動計畫並追蹤[span_11](start_span)[span_11](end_span)。成人與青少年不應完全停掉ICS；降階並非改成LABA單方[span_12](start_span)[span_12](end_span)。" },
    { id:"A6", ch:"氣喘", q:"8歲兒童用低劑量ICS控制欠佳，家長表示每天忘記給藥，想改用口服 montelukast。最適當的藥師建議？", options:{A:"先處理依從性與裝置問題；若仍選 montelukast，說明其防惡化效果較ICS 弱並告知神經精神風險", B:"montelukast 與ICS 防止惡化的效果相同，可直接無條件替代", C:"只要不願吸藥，就應改成長期口服 prednisolone", D:"口服藥不經肺部，因此沒有需要監測的不良反應"}, ans:"A", exp:"口服便利不等於療效等同ICS[span_13](start_span)[span_13](end_span)。兒童應先改善照護流程與裝置使用；選用 montelukast 時必須討論效益限制及神經精神風險[span_14](start_span)[span_14](end_span)。" },
    { id:"A7", ch:"氣喘", q:"10 歲兒童開始 montelukast 後出現新發惡夢、易怒與行為改變，近期沒有其他新藥。最適當的處置？", options:{A:"把所有氣喘控制藥都停掉，等行為恢復再說", B:"加倍 montelukast，以免停藥造成ICS反彈", C:"以睡前服用為由認定惡夢與藥物無關，繼續觀察數月", D:"懷疑藥物相關神經精神事件，停止 montelukast 並儘速聯絡處方醫師評估替代控制方案"}, ans:"D", exp:"新發神經精神症狀是 montelukast 的重要警訊，應停用並及時評估，但不可連帶停用所有ICS-containing 控制治療[span_15](start_span)[span_15](end_span)。" },
    { id:"A8", ch:"氣喘", q:"成人用 budesonide pMDI 後反覆口腔念珠菌感染，但氣喘控制良好。確認劑量適當後，何項介入最合理？", options:{A:"提高ICS 劑量，以其抗發炎效果治療念珠菌", B:"永久停用ICS，改用LABA單方避免感染", C:"吸藥後把漱口水吞下，讓藥效持續", D:"確認可相容的spacer 與正確技巧，每次吸藥後漱口並吐出，同時處理感染"}, ans:"D", exp:"局部副作用與口咽沉積有關[span_16](start_span)[span_16](end_span)。適用pMDI搭配相容 spacer、吸後漱口吐出可降低風險；感染須另行處理[span_17](start_span)[span_17](end_span)。" },

    { id:"C_App10", ch:"COPD", q:"(附錄原第10題) 嚴重 COPD 慢性支氣管炎患者使用三聯療法仍頻繁惡化，考慮加入 Roflumilast。關於此藥何者錯誤？", options:{A:"Roflumilast 是口服的 PDE-4 抑制劑具抗發炎作用", B:"可降低此類患者約 15%的惡化頻率", C:"主要副作用包括腹瀉、體重減輕和精神症狀", D:"為支氣管擴張劑，可取代 LABA 使用以減少藥物數量"}, ans:"D", exp:"Roflumilast 為口服抗發炎藥物，完全不具直接支氣管擴張作用，不可取代 LABA 或 LAMA[span_290](start_span)[span_290](end_span)。" },

let currentQuiz = [];
let userAnswers = {};

function startQuiz() {
  const selectedChapters = Array.from(document.querySelectorAll('input[name="chapter"]:checked')).map(el => el.value);
  if (selectedChapters.length === 0) {
    alert("請至少勾選一個測驗單元！");
    return;
  }

  // 匯總所選章節母體
  let pool = [];
  selectedChapters.forEach(ch => {
    if (QUESTION_BANK[ch]) {
      pool = pool.concat(QUESTION_BANK[ch]);
    }
  });

  // Fisher-Yates 洗牌演算法
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  // 依選擇題數決定抽題量
  const countChoice = document.querySelector('input[name="count"]:checked').value;
  let targetCount = pool.length;
  if (countChoice !== 'all') {
    const requested = parseInt(countChoice, 10);
    if (requested > pool.length) {
      alert(`您勾選的單元目前題庫總數為 ${pool.length} 題，將為您全數抽取進行測驗！`);
      targetCount = pool.length;
    } else {
      targetCount = requested;
    }
  }

  currentQuiz = pool.slice(0, targetCount);
  userAnswers = {};

  renderQuiz();
  document.getElementById('setup-view').classList.add('hidden');
  document.getElementById('result-view').classList.add('hidden');
  document.getElementById('quiz-view').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuiz() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  document.getElementById('quiz-count-text').innerText = `總共 ${currentQuiz.length} 題`;

  currentQuiz.forEach((q, idx) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question-card';
    qDiv.innerHTML = `
      <div class="question-header">
        <span class="chapter-tag">${q.ch}</span> ${idx + 1}. ${q.q}
      </div>
      <div class="choices-list">
        ${Object.entries(q.options).map(([optKey, optVal]) => `
          <label class="choice-item">
            <input type="radio" name="q_${idx}" value="${optKey}" onchange="recordAnswer(${idx}, '${optKey}')">
            <span><strong>(${optKey})</strong> ${optVal}</span>
          </label>
        `).join('')}
      </div>
    `;
    container.appendChild(qDiv);
  });
  updateProgress();
}

function recordAnswer(qIndex, answer) {
  userAnswers[qIndex] = answer;
  updateProgress();
}

function updateProgress() {
  const answeredCount = Object.keys(userAnswers).length;
  const pct = (answeredCount / currentQuiz.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('quiz-progress-text').innerText = `已作答：${answeredCount} / ${currentQuiz.length} 題`;
}

function submitQuiz() {
  const answeredCount = Object.keys(userAnswers).length;
  if (answeredCount < currentQuiz.length) {
    if (!confirm(`您還有 ${currentQuiz.length - answeredCount} 題尚未作答，確定要現在交卷結算嗎？`)) {
      return;
    }
  }

  let correctCount = 0;
  const reviewContainer = document.getElementById('review-container');
  reviewContainer.innerHTML = '';

  currentQuiz.forEach((q, idx) => {
    const userAns = userAnswers[idx] || "未作答";
    const isCorrect = userAns === q.ans;
    if (isCorrect) correctCount++;

    // 生成題目每個選項的顯示標籤
    const optionsHtml = Object.entries(q.options).map(([optKey, optVal]) => {
      let optClass = "review-opt";
      let tag = "";
      if (optKey === q.ans) {
        optClass += " is-correct";
        tag = " <span style='color:var(--success); font-weight:bold;'>[正確答案]</span>";
      } else if (optKey === userAns) {
        optClass += " is-user-wrong";
        tag = " <span style='color:var(--danger); font-weight:bold;'>[您的選擇]</span>";
      }
      return `<div class="${optClass}"><strong>(${optKey})</strong> ${optVal}${tag}</div>`;
    }).join('');

    const itemDiv = document.createElement('div');
    itemDiv.className = `review-item ${isCorrect ? '' : 'wrong'}`;
    itemDiv.innerHTML = `
      <div style="font-weight:600; margin-bottom:8px;">
        <span class="chapter-tag">${q.ch}</span> 第 ${idx + 1} 題：${q.q}
      </div>
      <div class="review-options">
        ${optionsHtml}
      </div>
      <div style="margin: 8px 0 6px 0; font-size:0.95rem;">
        您的答案：<strong style="color:${isCorrect ? 'var(--success)' : 'var(--danger)'}">(${userAns})</strong>
        ${!isCorrect ? ` ｜ 正確答案：<strong style="color:var(--success)">(${q.ans})</strong>` : '（答對 ✔）'}
      </div>
      <div class="analysis">
        <strong>💡 解析：</strong>${q.exp}
      </div>
    `;
    reviewContainer.appendChild(itemDiv);
  });

  const finalScore = Math.round((correctCount / currentQuiz.length) * 100);
  document.getElementById('score-display').innerText = `${finalScore} 分`;
  document.getElementById('stat-display').innerText = `答對率：${finalScore}%（答對 ${correctCount} 題 / 總計 ${currentQuiz.length} 題）`;

  document.getElementById('quiz-view').classList.add('hidden');
  document.getElementById('result-view').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
  document.getElementById('result-view').classList.add('hidden');
  document.getElementById('setup-view').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
